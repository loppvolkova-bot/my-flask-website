<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игры Первых — Всероссийский Конкурс</title>
    <!-- Подключаем официальный шрифт Движения из Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Строгое соответствие палитре Брендбука конкурса */
        :root {
            --pervye-red: #e62e2d;       /* Фирменный красный «Движения Первых» */
            --pervye-dark: #1e293b;      /* Графитовый для важного текста и меню */
            --pervye-bg: #ffffff;        /* Идеально белый чистый фон по регламенту */
            --card-bg: #f8fafc;          /* Светло-серый премиальный для подложек */
            --border-color: #e2e8f0;     /* Тонкие аккуратные рамки */
            --text-main: #0f172a;        
            --text-muted: #64748b;
        }

        body { 
            font-family: 'Golos Text', sans-serif; 
            background-color: var(--pervye-bg); 
            color: var(--text-main);
            margin: 0; 
            display: flex;
            min-height: 100vh;
        }

        /* Новая визуализация бокового меню (Sidebar) */
        .sidebar { 
            width: 290px; 
            background: var(--card-bg); 
            border-right: 1px solid var(--border-color);
            height: 100vh; 
            position: fixed; 
            padding: 40px 24px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
        }

        /* Брендированный логотип Движения */
        .sidebar h2 { 
            color: var(--pervye-dark); 
            margin-top: 0;
            margin-bottom: 40px; 
            font-size: 24px; 
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Та самая красная стрелочка-единица */
        .sidebar h2 span {
            color: var(--pervye-red);
            font-weight: 900;
        }

        /* Стильные минималистичные ссылки меню */
        .menu-link { 
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted); 
            text-decoration: none; 
            padding: 14px 16px; 
            font-size: 15px; 
            font-weight: 600;
            border-radius: 12px; 
            margin-bottom: 6px; 
            transition: all 0.2s ease;
        }

        .menu-link:hover { 
            background: #f1f5f9; 
            color: var(--pervye-dark); 
        }

        /* Активный раздел выделяется фирменным красным */
        .menu-link.active { 
            background: var(--pervye-red); 
            color: white; 
            box-shadow: 0 4px 14px rgba(230, 46, 45, 0.25);
        }

        /* Переключатель ролей (Требование 8.1 положения конкурса) */
        .role-section {
            margin-top: auto;
            background: var(--pervye-bg);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .role-section p { 
            font-size: 11px; 
            color: var(--text-muted); 
            margin: 0 0 12px 0; 
            text-transform: uppercase; 
            letter-spacing: 0.8px;
            font-weight: 700;
        }

        /* Главное расположение контента (Main Content) */
        .main-content { 
            margin-left: 290px; 
            padding: 50px 60px; 
            width: 100%; 
            box-sizing: border-box; 
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 24px; 
            margin-bottom: 45px; 
        }

        header h1 { 
            font-size: 32px; 
            font-weight: 800; 
            margin: 0; 
            color: var(--pervye-dark); 
            letter-spacing: -0.8px;
        }

        .current-role-badge { 
            background: var(--card-bg); 
            color: var(--pervye-dark); 
            padding: 8px 18px; 
            border-radius: 30px; 
            font-weight: 700; 
            font-size: 13px;
            border: 1px solid var(--border-color);
        }

        /* Новая геометрия разделов и карточек */
        .card { 
            background: var(--pervye-bg); 
            padding: 40px; 
            border-radius: 20px; 
            margin-bottom: 30px; 
            border: 1px solid var(--border-color); 
        }

        .card h2 { 
            font-size: 24px; 
            font-weight: 800;
            margin-top: 0; 
            margin-bottom: 24px; 
            color: var(--pervye-dark);
            letter-spacing: -0.5px;
        }

        .card p { 
            font-size: 16px; 
            line-height: 1.7; 
            color: #334155; 
        }

        /* Сеточное расположение блоков (Grid Layout) как в PDF-документах */
        .grid-layout { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 24px; 
            margin-top: 30px; 
        }

        .grid-card { 
            background: var(--card-bg); 
            padding: 28px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
            transition: all 0.2s ease;
        }

        .grid-card:hover { 
            transform: translateY(-2px); 
            border-color: var(--pervye-red);
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
        }

        .grid-card h3 { 
            margin-top: 0; 
            font-size: 19px; 
            font-weight: 700;
            color: var(--pervye-dark); 
        }

        /* Кнопки в фирменном красном цвете */
        .btn { 
            background: var(--pervye-dark); 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 10px; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block; 
            font-size: 14px; 
            font-weight: 700;
            transition: all 0.2s;
        }
        .btn:hover { background: var(--pervye-red); }

        .btn-role {
            display: block;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            background: var(--card-bg);
            color: var(--pervye-dark);
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
        }
        .btn-role:hover { background: var(--pervye-dark); color: white; }

        /* Панель модератора в строгом стиле */
        .admin-panel { 
            background: #fff8f8; 
            border: 1px solid #fee2e2; 
            padding: 35px; 
            border-radius: 20px; 
            margin-top: 35px; 
        }

        ol li { margin-bottom: 14px; font-size: 16px; color: #334155; line-height: 1.6; }
        
        /* Виджет ИИ-чат-бота */
        .ai-chat-widget { position: fixed; bottom: 30px; right: 30px; width: 340px; background: white; border-radius: 20px; box-shadow: 0 12px 32px rgba(15,23,42,0.12); border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
        .ai-chat-header { background: var(--pervye-dark); color: white; padding: 18px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .ai-chat-logs { height: 220px; overflow-y: auto; padding: 18px; font-size: 13px; background: #f8fafc; }
        .chat-msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; max-width: 80%; line-height: 1.5; }
        .chat-msg.user { background: var(--pervye-dark); color: white; margin-left: auto; }
        .chat-msg.ai { background: white; color: var(--text-main); border: 1px solid var(--border-color); }
        .ai-chat-input-area { display: flex; border-top: 1px solid var(--border-color); background: white; }
        .ai-chat-input { flex: 1; border: none; padding: 16px; font-size: 13px; outline: none; font-family: inherit; }
        .ai-chat-send { background: var(--pervye-red); color: white; border: none; padding: 0 20px; cursor: pointer; font-size: 13px; font-weight: 700; }
    </style>
</head>
<body>

    <!-- Меню слева (Официальные шрифты и цвета Движения) -->
    <div class="sidebar">
        <h2><span>1</span> Игры Первых</h2>
        <a href="/?role={{ role }}" class="menu-link {% if active_tab == 'about' %}active{% endif %}">💡 Идея проекта</a>
        <a href="/mechanics?role={{ role }}" class="menu-link {% if active_tab == 'mechanics' %}active{% endif %}">🎮 Механика игры</a>
        <a href="/calendar?role={{ role }}" class="menu-link {% if active_tab == 'calendar' %}active{% endif %}">📅 Календарь событий</a>
        <a href="/news?role={{ role }}" class="menu-link {% if active_tab == 'news' %}active{% endif %}">📰 Новости</a>
        <a href="/feedback?role={{ role }}" class="menu-link {% if active_tab == 'feedback' %}active{% endif %}">💬 Обратная связь</a>
        
        <div class="role-section">
            <p>Тестирование ролей (Пункт 8.1):</p>
            <a href="?role=Участник" class="btn btn-role" style="{% if role == 'Участник' %}background: var(--pervye-dark); color: white;{% endif %}">👤 Участник</a>
            <a href="?role=Администратор" class="btn btn-role" style="{% if role == 'Администратор' %}background: var(--pervye-dark); color: white;{% endif %}">🔑 Модератор</a>
        </div>
    </div>

    <!-- Основная область с текстом -->
    <div class="main-content">
        <header>
            <h1>Всероссийский проект «Игры Первых»</h1>
            <div class="current-role-badge">Роль: {{ role }}</div>
        </header>

        {% if active_tab == 'about' %}
        <div class="card">
            <h2>Концепция проекта</h2>
