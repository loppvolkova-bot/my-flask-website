<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игры Первых — Всероссийский Конкурс</title>

<body>
    <div class="sidebar">
        <h2>Игры Первых</h2> <!-- Единица убрана -->
        <!-- ... меню и роли ... -->
    </div>
    <!-- ... контентная часть ... -->
    <script>
        // ИСПРАВЛЕННАЯ ФУНКЦИЯ: лишний '?' удален
        function switchTab(tabName) {
            var contents = document.querySelectorAll('.tab-content');
            for (var i = 0; i < contents.length; i++) contents[i].classList.remove('active');
            var menuLinks = document.querySelectorAll('.sidebar .menu-link:not(.btn-role)');
            for (var j = 0; j < menuLinks.length; j++) menuLinks[j].classList.remove('active');
            
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('tab-' + tabName + '-btn').classList.add('active');
        }
        // ... остальные функции ...
    </script>
</body>
</html>
